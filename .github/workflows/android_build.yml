name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: bash ./gradlew assembleDebug

    - name: Upload APK Artifact
      id: artifact-upload
      uses: actions/upload-artifact@v4
      with:
        name: myanmartts-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Send Secure Link to Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🎉 Android Build အောင်မြင်သွားပါပြီ!
          
          📦 စိတ်ချရတဲ့ လုံခြုံရေးမြင့် ဒေါင်းလုဒ်လင့်ခ် (Zip ဖိုင်အနေနဲ့ တန်းဒေါင်းပါလိမ့်မယ်):
          ${{ steps.artifact-upload.outputs.artifact-url }}
          
