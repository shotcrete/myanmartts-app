name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: bash ./gradlew assembleDebug

    - name: Upload to High-Speed Storage & Send to Telegram
      run: |
        # -k သုံးပြီး SSL error ကို ကျော်ကာ bashupload ပေါ် လှမ်းတင်ခြင်း
        DOWNLOAD_URL=$(curl -k --upload-file app/build/outputs/apk/debug/app-debug.apk https://bashupload.com/app-debug.apk)
        
        # ရလာတဲ့ လင့်ခ်ကို Telegram ထဲ လှမ်းပို့ခြင်း
        curl -F chat_id="${{ secrets.TELEGRAM_TO }}" \
             -F text="🎉 Android Build အောင်မြင်သွားပါပြီ!
             
        📦 Browser ထဲ ဝင်စရာမလိုဘဲ တန်းနှိပ်ဒေါင်းရန် Direct Link:
        $DOWNLOAD_URL" \
             https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage
             
