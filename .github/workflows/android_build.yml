name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: bash ./gradlew assembleDebug

    - name: Create Private/Prerelease & Upload APK
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build #${{ github.run_number }}
        draft: false
        prerelease: true # ပြင်ပလူတွေ သတိမထားမိအောင် Prerelease အဖြစ် ဖျောက်ထားခြင်း
        files: app/build/outputs/apk/debug/app-debug.apk

    - name: Send Direct Link to Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🎉 Android Build အောင်မြင်သွားပါပြီ!
          
          📦 GoSpeed ထဲ ထည့်ဒေါင်းလို့ရမယ့် မြန်နှုန်းမြင့် Direct Download Link:
          https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-debug.apk
          
