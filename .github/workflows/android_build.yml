name: Android APK Build

on:
  push:
    branches: [ "main" ] # သင့် Branch နာမည် main မဟုတ်ရင် master သို့မဟုတ် သက်ဆိုင်ရာနာမည် ပြောင်းပေးပါ
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: bash ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/artifact@v4
      with:
        name: myanmartts-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Send APK Link to Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🎉 Android Build အောင်မြင်သွားပါပြီ!
          
          📦 APK ဖိုင်ကို အောက်က Link မှာ နှိပ်ပြီး Download ဆွဲနိုင်ပါပြီ-
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
