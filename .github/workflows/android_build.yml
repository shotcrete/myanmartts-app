name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: bash ./gradlew assembleDebug

    - name: Upload to High-Speed Storage & Send to Telegram
      run: |
        # ဖိုင်ကို မြန်နှုန်းမြင့် Server ပေါ် တင်ပြီး ဒေါင်းလုဒ်လင့်ခ် ယူခြင်း
        DOWNLOAD_URL=$(curl --upload-file app/build/outputs/apk/debug/app-debug.apk https://bashupload.com/app-debug.apk)
        
        # ရလာတဲ့ လင့်ခ်အစစ်ကို Telegram ထဲ လှမ်းပို့ခြင်း
        curl -F chat_id="${{ secrets.TELEGRAM_TO }}" \
             -F text="🎉 Android Build အောင်မြင်သွားပါပြီ! (ဖိုင်ဆိုဒ်ကြီးလို့ အောက်က Direct Link မှာ တန်းနှိပ်ဒေါင်းပါ)
             
        📦 Direct Download Link:
        $DOWNLOAD_URL" \
             https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage
             
